name: Auto-Update Alpine & Nginx Base

on:
  schedule:
    # Chạy tự động lúc 06:00 UTC mỗi ngày
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Latest Alpine & Nginx Versions
        id: check
        run: |
          set -e
          # 1. Đọc phiên bản hiện tại trong Dockerfile
          CUR_ALPINE=$(grep -E '^ARG ALPINE_VERSION=' Dockerfile | cut -d'=' -f2 | tr -d '" \r\n')
          CUR_NGINX=$(grep -E '^ARG NGINX_VERSION=' Dockerfile | cut -d'=' -f2 | tr -d '" \r\n')
          CUR_APP=$(grep -E '^ARG APP_VERSION=' Dockerfile | cut -d'=' -f2 | tr -d '" \r\n')

          echo "Current -> Alpine: ${CUR_ALPINE} | Nginx: ${CUR_NGINX} | App: ${CUR_APP}"

          # 2. Lấy nhánh Alpine Stable mới nhất (ví dụ: 3.24)
          LATEST_ALPINE=$(curl -fsSL "https://alpinelinux.org/releases.json" | jq -r '.release_branches[] | select(.rel_branch | test("^v[0-9]+\\.[0-9]+$")) | .rel_branch' | head -n1 | sed 's/^v//' | tr -d ' \r\n')
          if [ -z "$LATEST_ALPINE" ]; then
            LATEST_ALPINE="$CUR_ALPINE"
          fi

          # 3. Đọc trực tiếp phiên bản gói nginx từ APKINDEX chính thức của Alpine (nhanh tức thì & chuẩn 100%)
          LATEST_NGINX=$(curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/v${LATEST_ALPINE}/main/x86_64/APKINDEX.tar.gz" | tar -Oxz APKINDEX | awk -F: '$1 == "P" {pkg=$2} $1 == "V" && pkg == "nginx" {print $2; exit}' | tr -d ' \r\n')
          if [ -z "$LATEST_NGINX" ]; then
            LATEST_NGINX="$CUR_NGINX"
          fi

          echo "Latest  -> Alpine: ${LATEST_ALPINE} | Nginx: ${LATEST_NGINX}"

          if [ "$CUR_ALPINE" != "$LATEST_ALPINE" ] || [ "$CUR_NGINX" != "$LATEST_NGINX" ]; then
            BASE_VER=$(echo "$CUR_APP" | cut -d. -f1-2)
            PATCH_VER=$(echo "$CUR_APP" | cut -d. -f3)
            NEW_APP="${BASE_VER}.$((PATCH_VER + 1))"

            sed -i "s|^ARG ALPINE_VERSION=.*|ARG ALPINE_VERSION=${LATEST_ALPINE}|" Dockerfile
            sed -i "s|^ARG NGINX_VERSION=.*|ARG NGINX_VERSION=${LATEST_NGINX}|" Dockerfile
            sed -i "s|^ARG APP_VERSION=.*|ARG APP_VERSION=${NEW_APP}|" Dockerfile

            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "new_alpine=${LATEST_ALPINE}" >> "$GITHUB_OUTPUT"
            echo "new_nginx=${LATEST_NGINX}" >> "$GITHUB_OUTPUT"
            echo "new_app=${NEW_APP}" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & Push Updated Base Versions
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "chore(deps): bump Alpine to ${{ steps.check.outputs.new_alpine }} & Nginx to ${{ steps.check.outputs.new_nginx }} (v${{ steps.check.outputs.new_app }})"
          git push
