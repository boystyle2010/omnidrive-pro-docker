services:
  omnidrive-pro:
    image: ghcr.io/boystyle2010/omnidrive-pro:latest
    container_name: omnidrive-pro
    restart: unless-stopped
    labels:
      # Tự động hiển thị icon khi chạy trên CasaOS / Homepage
      icon: "https://raw.githubusercontent.com/boystyle2010/omnidrive-pro/main/icon.png"
    environment:
      - TZ=America/Denver
      - OMNI_USER=admin
      - OMNI_PASS=changeme_strong_password
      - SMB_ENABLED=true
      - SFTP_ENABLED=true
      - FTP_ENABLED=true
      - FANCY_UI=true
      - SHOW_DOTFILES=true
      - FTP_PASV_ADDRESS=192.168.1.100
    ports:
      - "8090:8090"               # Web UI, WebDAV & Share Links
      - "445:445"                 # SMB / Samba Server
      - "2222:2222"               # SFTP Server
      - "2121:2121"               # FTP Control Port
      - "21000-21002:21000-21002" # FTP Passive Data Ports
    volumes:
      # 1. Dữ liệu hệ thống của OmniDrive Pro (options.json, audit.jsonl, shares.json)
      - ./data:/data
      - ./ssl:/ssl

      # 2. Các thư mục mặc định
      - ./storage:/storage
      - ./media:/media
      - ./share:/share
      - ./backup:/backup

      # 3. TỰ ĐỘNG MOUNT (AUTO-DISCOVERY):
      # Bạn muốn quản lý thêm bất kỳ thư mục nào trên máy chủ Linux (như CasaOS AppData, Docker, Downloads...),
      # chỉ cần mount vào /mnt/<Tên_Thư_Mục> là tự động xuất hiện trên Web, WebDAV, SMB, SFTP & FTP!
      - /DATA/AppData:/mnt/appdata
      # - /home/ubuntu:/mnt/home_server
      # - /etc/docker:/mnt/docker_configs
