name: omnidrive-pro

services:
  omnidrive-pro:
    # Kiểm tra khớp đúng tên package trên GitHub Packages (omnidrive-pro hoặc omnidrive-pro-docker)
    image: ghcr.io/boystyle2010/omnidrive-pro-docker:latest
    container_name: omnidrive-pro
    restart: unless-stopped
    labels:
      icon: "https://raw.githubusercontent.com/boystyle2010/omnidrive-pro-docker/main/icon.png"
      name: "OmniDrive Pro"
      web: "8090"
    environment:
      - TZ=America/Denver

      # !!! ĐỔI MẬT KHẨU NÀY trước khi khởi động lần đầu !!!
      # Tài khoản chính từ OMNI_USER mặc định có role "admin".
      # Để thêm tài khoản phụ (role: "user") và phân quyền thư mục (allowed_users, read_only),
      # chỉnh trực tiếp trong file ./data/options.json rồi restart container.
      - OMNI_USER=admin
      - OMNI_PASS=changeme_strong_password

      - SMB_ENABLED=true
      - SFTP_ENABLED=true
      - FTP_ENABLED=true
      - FANCY_UI=true
      - SHOW_DOTFILES=true

      # Web Terminal (chỉ tài khoản role "admin" mới dùng được, tài khoản "user" luôn bị chặn)
      - ENABLE_TERMINAL=false

      # Chế độ quyền thực thi (false = chạy dưới user omnidrive PUID:PGID; true = chạy quyền root)
      - ROOT_ACCESS=false
      # - PUID=1000
      # - PGID=1000

      # Mã hóa FTP (optional | required | off)
      # - FTP_TLS=optional

      # Khóa thư mục gốc Root (true = không cho tạo/xóa file trực tiếp ngoài Root)
      # - LOCK_ROOT=true

      # Connect Hub & FTP Passive: đặt IP LAN của máy chủ Docker (và tên miền Cloudflare nếu có)
      # - LAN_IP=192.168.1.100
      # - FTP_PASV_ADDRESS=192.168.1.100
      # - PUBLIC_URL=https://drive.example.com

      # Reverse proxy / Cloudflare Tunnel: IP hoặc dải IP proxy tin cậy để lấy đúng IP thật của client
      # - TRUSTED_PROXIES=127.0.0.0/8,172.16.0.0/12
      # - REAL_IP_HEADER=X-Forwarded-For

      # Connect Hub: nếu bạn đổi cổng host bên dưới (ví dụ "8095:8090" hoặc "4450:445"),
      # khai báo lại tại đây để UI hiển thị đúng địa chỉ kết nối
      # - EXTERNAL_PORT=8090
      # - SMB_PORT=445
      # - SFTP_PORT=2222
      # - FTP_PORT=2121

      # Giới hạn dung lượng thư mục tải dạng ZIP qua link chia sẻ (MB)
      # - SHARE_ZIP_MAX_MB=2048
    ports:
      - "8090:8090"               # Web UI, WebDAV & Share Links (có thể đổi thành "8095:8090" nếu trùng)
      - "445:445"                 # SMB / Samba
      - "2222:2222"               # SFTP (Chỉ Admin)
      - "2121:2121"               # FTP control port (Chỉ Admin)
      - "21000-21002:21000-21002" # FTP passive data ports
    volumes:
      - ./data:/data
      - ./ssl:/ssl
      - ./backup:/backup
      - ./storage:/storage
      - ./media:/media
      - ./share:/share

      # TÙY CHỌN: Toàn quyền máy chủ Host (chỉ tài khoản role "admin" mới truy cập được /host_system)
      # - /:/host_root:rw

      # TÙY CHỌN: Mount thêm thư mục vào /mnt/<Ten> (mặc định chỉ admin truy cập, muốn chia sẻ cho user
      # thì thêm vào mục "shares" trong ./data/options.json)
      # - /DATA:/mnt/DATA
      # - /home:/mnt/home
    x-casaos:
      title:
        en_us: OmniDrive Pro
      icon: https://raw.githubusercontent.com/boystyle2010/omnidrive-pro-docker/main/icon.png

x-casaos:
  title:
    en_us: OmniDrive Pro
  tagline:
    en_us: Multi-protocol storage hub
  icon: https://raw.githubusercontent.com/boystyle2010/omnidrive-pro-docker/main/icon.png
  main: omnidrive-pro
  index: /
  port_map: "8090"
