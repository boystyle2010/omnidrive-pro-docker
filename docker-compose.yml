services:
  omnidrive-pro:
    image: ghcr.io/boystyle2010/omnidrive-pro:latest
    container_name: omnidrive-pro
    restart: unless-stopped
    labels:
      icon: "https://raw.githubusercontent.com/boystyle2010/omnidrive-pro/main/icon.png"
    environment:
      - TZ=America/Denver
      - OMNI_USER=admin
      - OMNI_PASS=changeme_strong_password
      - SMB_ENABLED=true
      - SFTP_ENABLED=true
      - FTP_ENABLED=true
      - FANCY_UI=true
      - SHOW_DOTFILES=true
      # Điền IP LAN của máy chủ Linux để FTP Passive Mode hoạt động mượt
      - FTP_PASV_ADDRESS=192.168.1.100
    ports:
      - "8099:8090"               # Web UI, WebDAV & Share Links[cite: 2]
      - "445:445"                 # SMB / Samba Server[cite: 2]
      - "2222:2222"               # SFTP Server[cite: 2]
      - "2121:2121"               # FTP Control Port[cite: 2]
      - "21000-21002:21000-21002" # FTP Passive Data Ports[cite: 2]
    volumes:
      # 1. Nơi lưu cấu hình, audit log & share links của OmniDrive Pro
      - ./data:/data
      - ./ssl:/ssl
      - ./backup:/backup
      - ./storage:/storage
      - ./media:/media
      - ./share:/share

      # 2. QUAN TRỌNG: Gắn toàn bộ gốc "/" của máy chủ Linux vào "/host_system"
      # Giúp bạn xem và sửa được 100% mọi file trên máy chủ
      - /:/host_root:rw

      # 3. Các lối tắt (Shortcut) hiển thị ngay ngoài màn hình chính để vào nhanh:
      - /DATA:/mnt/DATA
      - /home:/mnt/home
      - /etc:/mnt/etc
      - /opt:/mnt/opt
      - /var/log:/mnt/var_log
